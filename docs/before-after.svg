<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="764" viewBox="0 0 1240 764" role="img" aria-label="Before and after comparison of a research onboarding skill"><rect width="1240" height="764" fill="#FCFBF9"/><text x="44" y="56" font-family="Charter,&apos;Bitstream Charter&apos;,&apos;Iowan Old Style&apos;,Georgia,&apos;Times New Roman&apos;,serif" font-size="27" fill="#191C20" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="0">Same question. The difference is everything before the explanation.</text><text x="44" y="84" font-family="-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#71767C" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="0">A researcher in nonlinear optics asks about a neighbouring field.</text><rect x="44" y="112" width="558" height="600" rx="8" fill="#FFFFFF" stroke="#E5E2DC"/><path d="M 44.5 120 v 584" stroke="#B23A2B" stroke-width="3" stroke-linecap="round"/><text x="70" y="148" font-family="-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#B23A2B" font-weight="600" font-style="normal" text-anchor="start" letter-spacing="0">Any assistant</text><path d="M 70 164 H 576" stroke="#E5E2DC"/><rect x="70" y="182" width="506" height="42" rx="6" fill="#F5F3EF"/><text x="84" y="208" font-family="-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#71767C" font-weight="normal" font-style="italic" text-anchor="start" letter-spacing="0">Tell me about topological photonics.</text><text x="70" y="264" font-family="Charter,&apos;Bitstream Charter&apos;,&apos;Iowan Old Style&apos;,Georgia,&apos;Times New Roman&apos;,serif" font-size="15.5" fill="#2C3238" xml:space="preserve">Topological photonics engineers <tspan fill="#B23A2B">Berry curvature</tspan> in <tspan fill="#B23A2B">photonic bands</tspan></text><text x="70" y="291" font-family="Charter,&apos;Bitstream Charter&apos;,&apos;Iowan Old Style&apos;,Georgia,&apos;Times New Roman&apos;,serif" font-size="15.5" fill="#2C3238" xml:space="preserve">so that <tspan fill="#B23A2B">edge states</tspan> inherit a <tspan fill="#B23A2B">bulk invariant</tspan>. In <tspan fill="#B23A2B">Chern insulators</tspan>,</text><text x="70" y="318" font-family="Charter,&apos;Bitstream Charter&apos;,&apos;Iowan Old Style&apos;,Georgia,&apos;Times New Roman&apos;,serif" font-size="15.5" fill="#2C3238" xml:space="preserve">breaking <tspan fill="#B23A2B">time-reversal symmetry</tspan> with a <tspan fill="#B23A2B">gyromagnetic response</tspan></text><text x="70" y="345" font-family="Charter,&apos;Bitstream Charter&apos;,&apos;Iowan Old Style&apos;,Georgia,&apos;Times New Roman&apos;,serif" font-size="15.5" fill="#2C3238" xml:space="preserve">opens a gap at the <tspan fill="#B23A2B">Dirac point</tspan>; the resulting <tspan fill="#B23A2B">chiral edge modes</tspan></text><text x="70" y="372" font-family="Charter,&apos;Bitstream Charter&apos;,&apos;Iowan Old Style&apos;,Georgia,&apos;Times New Roman&apos;,serif" font-size="15.5" fill="#2C3238" xml:space="preserve">are immune to <tspan fill="#B23A2B">backscattering</tspan>. <tspan fill="#B23A2B">Valley-Hall</tspan> and <tspan fill="#B23A2B">Floquet</tspan> analogues</text><text x="70" y="399" font-family="Charter,&apos;Bitstream Charter&apos;,&apos;Iowan Old Style&apos;,Georgia,&apos;Times New Roman&apos;,serif" font-size="15.5" fill="#2C3238" xml:space="preserve">avoid magnetic bias entirely.</text><rect x="70" y="448" width="506" height="48" rx="6" fill="#F5F3EF"/><text x="84" y="472" font-family="-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#71767C" font-weight="normal" font-style="italic" text-anchor="start" letter-spacing="0">Wait, which of those am I supposed to already know?</text><text x="70" y="536" font-family="Charter,&apos;Bitstream Charter&apos;,&apos;Iowan Old Style&apos;,Georgia,&apos;Times New Roman&apos;,serif" font-size="15.5" fill="#2C3238" xml:space="preserve">Berry curvature is the curl of the <tspan fill="#B23A2B">Berry connection</tspan>,</text><text x="70" y="563" font-family="Charter,&apos;Bitstream Charter&apos;,&apos;Iowan Old Style&apos;,Georgia,&apos;Times New Roman&apos;,serif" font-size="15.5" fill="#2C3238" xml:space="preserve">i.e. the <tspan fill="#B23A2B">geometric phase density</tspan> of a <tspan fill="#B23A2B">Bloch band</tspan>.</text><path d="M 70 624 H 576" stroke="#E5E2DC"/><text x="70" y="646" font-family="-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#B23A2B" font-weight="600" font-style="normal" text-anchor="start" letter-spacing="0">Twelve terms you cannot yet audit.</text><text x="70" y="668" font-family="-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#B23A2B" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="0">Asking again just produces more of them.</text><rect x="638" y="112" width="558" height="600" rx="8" fill="#FFFFFF" stroke="#E5E2DC"/><path d="M 638.5 120 v 584" stroke="#1F4E9C" stroke-width="3" stroke-linecap="round"/><text x="664" y="148" font-family="-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#1F4E9C" font-weight="600" font-style="normal" text-anchor="start" letter-spacing="0">With Field Onboarding</text><path d="M 664 164 H 1170" stroke="#E5E2DC"/><rect x="664" y="182" width="506" height="42" rx="6" fill="#F5F3EF"/><text x="678" y="208" font-family="-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#71767C" font-weight="normal" font-style="italic" text-anchor="start" letter-spacing="0">Tell me about topological photonics.</text><text x="664" y="260" font-family="-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#2C3238" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="0">Before we start: the shortest bridge from what you</text><text x="664" y="282" font-family="-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#2C3238" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="0">already know. Mark each one.</text><text x="664" y="310" font-family="-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#191C20" font-weight="600" font-style="normal" text-anchor="start" letter-spacing="0">Bloch modes and band structure</text><text x="664" y="329" font-family="-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif" font-size="12.8" fill="#71767C" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="0">the field describes light as bands over momentum space</text><rect x="664" y="340" width="60" height="22" rx="5" fill="#F3F1ED" stroke="#E2DFD8"/><text x="694.05" y="355" font-family="-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#71767C" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">used it</text><rect x="732.1" y="340" width="79" height="22" rx="5" fill="#F3F1ED" stroke="#E2DFD8"/><text x="771.6" y="355" font-family="-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#71767C" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">learned it</text><rect x="819.1" y="340" width="35" height="22" rx="5" fill="#F3F1ED" stroke="#E2DFD8"/><text x="836.5500000000001" y="355" font-family="-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#71767C" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">new</text><text x="664" y="378" font-family="-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#191C20" font-weight="600" font-style="normal" text-anchor="start" letter-spacing="0">Berry phase and Berry curvature</text><text x="664" y="397" font-family="-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif" font-size="12.8" fill="#71767C" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="0">these are what become the topological invariants</text><rect x="664" y="408" width="60" height="22" rx="5" fill="#F3F1ED" stroke="#E2DFD8"/><text x="694.05" y="423" font-family="-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#71767C" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">used it</text><rect x="732.1" y="408" width="79" height="22" rx="5" fill="#F3F1ED" stroke="#E2DFD8"/><text x="771.6" y="423" font-family="-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#71767C" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">learned it</text><rect x="819.1" y="408" width="35" height="22" rx="5" fill="#F3F1ED" stroke="#E2DFD8"/><text x="836.5500000000001" y="423" font-family="-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#71767C" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">new</text><text x="664" y="446" font-family="-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#191C20" font-weight="600" font-style="normal" text-anchor="start" letter-spacing="0">Tight-binding and coupled-mode models</text><text x="664" y="465" font-family="-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif" font-size="12.8" fill="#71767C" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="0">compact descriptions of lattices of resonators</text><rect x="664" y="476" width="60" height="22" rx="5" fill="#F3F1ED" stroke="#E2DFD8"/><text x="694.05" y="491" font-family="-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#71767C" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">used it</text><rect x="732.1" y="476" width="79" height="22" rx="5" fill="#F3F1ED" stroke="#E2DFD8"/><text x="771.6" y="491" font-family="-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#71767C" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">learned it</text><rect x="819.1" y="476" width="35" height="22" rx="5" fill="#F3F1ED" stroke="#E2DFD8"/><text x="836.5500000000001" y="491" font-family="-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#71767C" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">new</text><text x="664" y="514" font-family="-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif" font-size="14.5" fill="#191C20" font-weight="600" font-style="normal" text-anchor="start" letter-spacing="0">Symmetry and symmetry breaking</text><text x="664" y="533" font-family="-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif" font-size="12.8" fill="#71767C" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="0">decides which topological phases can exist at all</text><rect x="664" y="544" width="60" height="22" rx="5" fill="#F3F1ED" stroke="#E2DFD8"/><text x="694.05" y="559" font-family="-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#71767C" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">used it</text><rect x="732.1" y="544" width="79" height="22" rx="5" fill="#F3F1ED" stroke="#E2DFD8"/><text x="771.6" y="559" font-family="-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#71767C" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">learned it</text><rect x="819.1" y="544" width="35" height="22" rx="5" fill="#F3F1ED" stroke="#E2DFD8"/><text x="836.5500000000001" y="559" font-family="-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#71767C" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0">new</text><text x="664" y="590" font-family="-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#71767C" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="0">And your target: read one paper, follow a talk,</text><text x="664" y="611" font-family="-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#71767C" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="0">or build something?</text><path d="M 664 624 H 1170" stroke="#E5E2DC"/><text x="664" y="646" font-family="-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1F4E9C" font-weight="600" font-style="normal" text-anchor="start" letter-spacing="0">One turn of intake.</text><text x="664" y="668" font-family="-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1F4E9C" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="0">Then one rung per turn, anchored to what you marked.</text></svg>